<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="no-referrer">
    <title>لوحة متابعة الوالدين</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="parent-page">
    <header class="parent-topbar">
        <a class="brand" href="index.html"><span class="brand-icon"><i class="fas fa-graduation-cap"></i></span> <span id="brandText">لوحة الوالدين</span></a>
        <div style="display:flex; gap:10px; align-items:center">
            <button class="lang-toggle" id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
            <a class="btn btn-ghost btn-sm" href="index.html" id="homeLink">الرئيسية</a>
        </div>
    </header>

    <main class="parent-container">
        <!-- Code entry -->
        <section class="code-entry" id="codeEntry">
            <div class="card">
                <h1 id="pvTitle" style="font-size:1.4rem">متابعة ابنك/ابنتك</h1>
                <p class="hint" id="pvDesc">أدخل رمز المتابعة الذي شاركه ابنك</p>
                <input type="text" id="trackingCodeInput" maxlength="12" placeholder="BTS-123456" autocomplete="off">
                <div class="pv-error" id="codeError"></div>
                <button class="btn btn-primary btn-block" id="connectBtn">اتصال</button>
                <div class="pv-spinner" id="loadingSpinner"></div>
            </div>
        </section>

        <!-- Dashboard -->
        <section id="parentDashboard" style="display:none">
            <div class="card pv-student">
                <div class="user-avatar" id="studentAvatar">م</div>
                <div style="flex:1">
                    <b id="studentName" style="font-size:1.1rem">—</b>
                    <div class="hint" id="studentEmail">—</div>
                </div>
                <span class="chip chip-primary" id="trackingCodeText">—</span>
                <button class="btn btn-ghost btn-sm" id="disconnectBtn">قطع الاتصال</button>
            </div>

            <div class="stats-grid">
                <div class="card stat-card stat-completed"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div><div class="stat-number" id="pvDoneHw">0</div><div class="stat-label">واجب منجز</div></div></div>
                <div class="card stat-card stat-homework"><div class="stat-icon"><i class="fas fa-book"></i></div><div><div class="stat-number" id="pvPendingHw">0</div><div class="stat-label">واجب متبقٍ</div></div></div>
                <div class="card stat-card stat-streak"><div class="stat-icon"><i class="fas fa-clock"></i></div><div><div class="stat-number" id="pvStudyMin">0</div><div class="stat-label">دقائق مذاكرة اليوم</div></div></div>
                <div class="card stat-card stat-exams"><div class="stat-icon"><i class="fas fa-coins"></i></div><div><div class="stat-number" id="pvPoints">0</div><div class="stat-label">النقاط</div></div></div>
            </div>

            <div class="grid-2">
                <div class="card"><div class="card-title"><i class="fas fa-calendar-day"></i> <span id="pvSchTitle">جدول اليوم</span></div><div class="item-list" id="pvSchedule"></div></div>
                <div class="card"><div class="card-title"><i class="fas fa-file-alt"></i> <span id="pvExTitle">الامتحانات القادمة</span></div><div class="item-list" id="pvExams"></div></div>
            </div>
            <div class="pv-section card"><div class="card-title"><i class="fas fa-book"></i> <span id="pvHwTitle">الواجبات</span></div><div class="item-list" id="pvHomework"></div></div>

            <div class="pv-section card">
                <div class="card-title"><i class="fas fa-gift"></i> <span id="pvRwTitle">المكافآت</span></div>
                <form id="rewardForm" class="form-row" style="align-items:end" novalidate>
                    <div class="field"><label id="pvRwLabel">المكافأة</label><input type="text" id="rewardLabel"></div>
                    <div class="field"><label id="pvRwCost">التكلفة (نقاط)</label><input type="number" id="rewardCost" min="10" value="100"></div>
                    <button type="submit" class="btn btn-accent" style="margin-bottom:16px" id="pvRwAdd">إضافة</button>
                </form>
                <div id="pvRewards"></div>
            </div>

            <div class="pv-last"><span id="pvUpdated">آخر تحديث:</span> <b id="lastUpdate">—</b>
                <button class="btn btn-ghost btn-sm" id="refreshBtn" style="margin-inline-start:10px">تحديث</button></div>
        </section>
    </main>

    <div id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="i18n.js"></script>
    <script src="parent.js"></script>
</body>
</html>
