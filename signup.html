<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="no-referrer">
    <title data-i18n="signup_title">حساب جديد</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <aside class="auth-aside">
        <a class="brand" href="index.html"><span class="brand-icon"><i class="fas fa-graduation-cap"></i></span> <span data-i18n="app_name">العودة للمدرسة</span></a>
        <h2 data-i18n="signup_subtitle">ابدأ تنظيم يومك الدراسي</h2>
        <p data-i18n="hero_sub">متابعة الواجبات والامتحانات والجدول اليومي.</p>
        <ul>
            <li><i class="fas fa-check-circle"></i> <span data-i18n="feat_t3">إنجازات ومكافآت</span></li>
            <li><i class="fas fa-check-circle"></i> <span data-i18n="feat_t2">جدول ذكي</span></li>
            <li><i class="fas fa-check-circle"></i> <span data-i18n="feat_t4">متابعة الوالدين</span></li>
        </ul>
    </aside>

    <main class="auth-main">
        <div class="auth-card card">
            <div class="mobile-brand brand" style="justify-content:center"><span class="brand-icon"><i class="fas fa-graduation-cap"></i></span> <span data-i18n="app_name">العودة للمدرسة</span></div>
            <h1 data-i18n="signup_title">حساب جديد</h1>
            <p class="subtitle" data-i18n="signup_subtitle">ابدأ تنظيم يومك الدراسي</p>
            <div id="authError" class="auth-error"></div>
            <form id="signupForm" novalidate>
                <div class="field">
                    <label for="displayName" data-i18n="display_name">الاسم الكامل</label>
                    <input type="text" id="displayName" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="email" data-i18n="email">البريد الإلكتروني</label>
                    <input type="email" id="email" autocomplete="email" placeholder="name@example.com" required>
                </div>
                <div class="field">
                    <label for="password" data-i18n="password">كلمة المرور</label>
                    <input type="password" id="password" autocomplete="new-password" required>
                    <div class="pw-strength"><span id="strengthFill" style="width:0"></span></div>
                    <div class="pw-strength-text" id="strengthText"></div>
                </div>
                <div class="field">
                    <label for="confirmPassword" data-i18n="confirm_password">تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-user-plus"></i> <span data-i18n="signup_submit">إنشاء الحساب</span></button>
            </form>
            <div class="auth-footer">
                <span data-i18n="have_account">لديك حساب بالفعل؟</span> <a href="login.html" data-i18n="go_login">سجّل دخولك</a>
            </div>
            <div class="auth-alt-links">
                <a href="index.html"><i class="fas fa-arrow-right"></i> <span data-i18n="back_home">العودة للرئيسية</span></a>
            </div>
            <div style="text-align:center; margin-top:14px">
                <button class="lang-toggle" id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
            </div>
        </div>
    </main>

    <style>
        .pw-strength span { display: block; height: 100%; border-radius: 999px; background: var(--danger); transition: width .2s, background .2s; }
        .pw-strength { height: 5px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
</body>
</html>
