<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="no-referrer">
    <title data-i18n="login_title">تسجيل الدخول</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <aside class="auth-aside">
        <a class="brand" href="index.html"><span class="brand-icon"><i class="fas fa-graduation-cap"></i></span> <span data-i18n="app_name">العودة للمدرسة</span></a>
        <h2 data-i18n="hero_tag">نظّم يومك الدراسي من الاستيقاظ حتى النوم</h2>
        <p data-i18n="hero_sub">متابعة الواجبات والامتحانات والجدول اليومي.</p>
        <ul>
            <li><i class="fas fa-check-circle"></i> <span data-i18n="feat_t1">واجبات وامتحانات</span></li>
            <li><i class="fas fa-check-circle"></i> <span data-i18n="feat_t2">جدول ذكي</span></li>
            <li><i class="fas fa-check-circle"></i> <span data-i18n="feat_t4">متابعة الوالدين</span></li>
        </ul>
    </aside>

    <main class="auth-main">
        <div class="auth-card card">
            <div class="mobile-brand brand" style="justify-content:center"><span class="brand-icon"><i class="fas fa-graduation-cap"></i></span> <span data-i18n="app_name">العودة للمدرسة</span></div>
            <h1 data-i18n="login_title">مرحباً بعودتك!</h1>
            <p class="subtitle" data-i18n="login_subtitle">سجّل دخولك للمتابعة</p>
            <div id="authError" class="auth-error"></div>
            <form id="loginForm" novalidate>
                <div class="field">
                    <label for="email" data-i18n="email">البريد الإلكتروني</label>
                    <input type="email" id="email" autocomplete="email" placeholder="name@example.com" required>
                </div>
                <div class="field">
                    <label for="password" data-i18n="password">كلمة المرور</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <div class="auth-links">
                    <label><input type="checkbox" id="rememberMe"> <span data-i18n="remember">تذكرني</span></label>
                    <a href="#" id="forgotPw" data-i18n="forgot">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-sign-in-alt"></i> <span data-i18n="login_submit">تسجيل الدخول</span></button>
            </form>
            <div class="auth-footer">
                <span data-i18n="no_account">ليس لديك حساب؟</span> <a href="signup.html" data-i18n="create_account">أنشئ حساباً جديداً</a>
            </div>
            <div class="auth-alt-links">
                <a href="index.html"><i class="fas fa-arrow-right"></i> <span data-i18n="back_home">العودة للرئيسية</span></a>
                <a href="parent.html"><i class="fas fa-users"></i> <span data-i18n="parent_login">دخول الوالدين</span></a>
            </div>
            <div style="text-align:center; margin-top:14px">
                <button class="lang-toggle" id="langToggle"><i class="fas fa-globe"></i> <span id="langLabel">EN</span></button>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
</body>
</html>
